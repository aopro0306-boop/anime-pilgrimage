<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  #map { width: 100%; height: 100vh; }
  #filter-panel{position:absolute;top:12px;left:12px;z-index:690;padding:12px;max-width:280px;background:rgba(255,255,255,0.95);border-radius:8px;max-height:70vh;overflow-y:auto;box-shadow:0 2px 8px rgba(0,0,0,0.2);}
  #anime-filter label{display:block;font-size:13px;margin:2px 0;}
  .type-chip{display:inline-block;margin:4px 4px 0 0;padding:4px 10px;border-radius:999px;border:1px solid #ccc;background:#fff;cursor:pointer;font-size:12px;}
  .type-chip.active{background:#333;color:#fff;}
  .spot-popup{font-family:sans-serif;min-width:180px;}
  .spot-popup .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:#eee;margin-bottom:6px;}
  .spot-popup h3{margin:4px 0;font-size:15px;}
  .spot-popup p{margin:2px 0;font-size:13px;color:#555;}
  .spot-popup .desc{margin-top:6px;font-size:13px;color:#333;}
  .spot-popup a{display:inline-block;margin-top:8px;font-size:13px;}
  .spot-popup .photo{width:100%;max-width:240px;height:auto;border-radius:6px;display:block;margin-top:4px;}
  .spot-popup .photo-credit{margin-top:2px;font-size:10px;color:#999;}
  .spot-popup .photo-credit a{margin-top:0;font-size:10px;}
  #pref-nav{position:absolute;top:12px;right:12px;z-index:690;padding:12px;width:200px;max-height:70vh;overflow-y:auto;background:rgba(255,255,255,0.95);border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.2);}
  #pref-nav h4{margin:0 0 8px 0;font-size:13px;}
  .pref-nav-item{padding:4px 2px;font-size:13px;cursor:pointer;border-bottom:1px solid #eee;}
  .pref-nav-item:hover{background:#f5f5f5;}
  @media (max-width: 640px) {
    #filter-panel, #pref-nav { width: calc(50vw - 24px); max-width: none; box-sizing: border-box; }
  }
</style>
</head>

ons.wikimedia.org/wiki/File:Ueda_Castle.JPG"},"kiminonaha-keta-wakamiya-jinja":{"url":"https://upload.wikimedia.org/wikipedia/commons/8/85/Keta_wakamiya.jpg","author":"Opqr","license":"CC BY-SA 4.0","sourceUrl":"https://commons.wikimedia.org/wiki/File:Keta_wakamiya.jpg"},"kiminonaha-hida-library":{"url":"https://commons.wikimedia.org/wiki/Special:FilePath/Hida_City_Library_exterior_ac_(1).jpg?width=400","author":"Asturio Cantabrio","license":"CC BY-SA 4.0","sourceUrl":"https://commons.wikimedia.org/wiki/File:Hida_City_Library_exterior_ac_(1).jpg"},"kiminonaha-kitte-garden":{"url":"https://commons.wikimedia.org/wiki/Special:FilePath/JP-Tower-01.jpg?width=400","author":"Rs1421","license":"CC BY-SA 3.0","sourceUrl":"https://commons.wikimedia.org/wiki/File:JP-Tower-01.jpg"},"kimetsu-homan-kamado-jinja":{"url":"https://commons.wikimedia.org/wiki/Special:FilePath/1st_torii_of_Kamado_Shrine.jpg?width=400","author":"そらみみ","license":"CC BY-SA 4.0","sourceUrl":"https://commons.wikimedia.org/wiki/File:1st_torii_of_Kamado_Shrine.jpg"},"sen-tatemonoen-kodakarayu":{"url":"https://commons.wikimedia.org/wiki/Special:FilePath/Kodakara-Yu_Entrance.jpg?width=400","author":"TANAKA Juuyoh","license":"CC BY 2.0","sourceUrl":"https://commons.wikimedia.org/wiki/File:Kodakara-Yu_Entrance.jpg"},"sen-gunchuko-station":{"url":"https://commons.wikimedia.org/wiki/Special:FilePath/Iyo_Railway_Gunch%C5%AB_Port_Station.jpg?width=400","author":"がっさん","license":"CC BY-SA 4.0","sourceUrl":"https://commons.wikimedia.org/wiki/File:Iyo_Railway_Gunch%C5%AB_Port_Station.jpg"},"yurucamp-fuefukigawa-park":{"url":"https://commons.wikimedia.org/wiki/Special:FilePath/Fuefukigawa_Fruits_Park,_Yamanashi,_Yamanashi,_Japan.jpg?width=400","author":"っ","license":"CC BY-SA 3.0","sourceUrl":"https://commons.wikimedia.org/wiki/File:Fuefukigawa_Fruits_Park,_Yamanashi,_Yamanashi,_Japan.jpg"},"yurucamp-utsubuna-station":{"url":"https://commons.wikimedia.org/wiki/Special:FilePath/JR_Central_Utsubuna_Station_building.jpg?width=400","author":"Mister0124","license":"CC BY-SA 4.0","sourceUrl":"https://commons.wikimedia.org/wiki/File:JR_Central_Utsubuna_Station_building.jpg"},"yurucamp-takabocchi-kogen":{"url":"https://commons.wikimedia.org/wiki/Special:FilePath/View_from_Takabocchi_early_in_the_morning.jpg?width=400","author":"TAKAO Tsushima","license":"CC BY 4.0","sourceUrl":"https://commons.wikimedia.org/wiki/File:View_from_Takabocchi_early_in_the_morning.jpg"},"yurucamp-shibireko-suimeiso":{"url":"https://commons.wikimedia.org/wiki/Special:FilePath/Lake_Shibire.JPG?width=400","author":"さかおり","license":"CC BY-SA 3.0","sourceUrl":"https://commons.wikimedia.org/wiki/File:Lake_Shibire.JPG"},"keion-toyosato-school":{"url":"https://commons.wikimedia.org/wiki/Special:FilePath/%E8%B1%8A%E9%83%B7%E5%B0%8F%E5%AD%A6%E6%A0%A1%E6%97%A7%E6%A0%A1%E8%88%8E.jpg?width=400","author":"オクノサンライズ","license":"CC BY-SA 4.0","sourceUrl":"https://commons.wikimedia.org/wiki/File:%E8%B1%8A%E9%83%B7%E5%B0%8F%E5%AD%A6%E6%A0%A1%E6%97%A7%E6%A0%A1%E8%88%8E.jpg"},"keion-teramachi-kyogoku":{"url":"https://commons.wikimedia.org/wiki/Special:FilePath/Teramachi_Street_shopping_area_1.jpg?width=400","author":"Mx. Granger","license":"CC0 1.0 (Public Domain)","sourceUrl":"https://commons.wikimedia.org/wiki/File:Teramachi_Street_shopping_area_1.jpg"},"haruhi-koyoen-station":{"url":"https://commons.wikimedia.org/wiki/Special:FilePath/Hankyu_Koyoen_Station.jpg?width=400","author":"KishujiRapid","license":"CC BY-SA 4.0","sourceUrl":"https://commons.wikimedia.org/wiki/File:Hankyu_Koyoen_Station.jpg"},"summerwars-besshosen-marumado":{"url":"https://commons.wikimedia.org/wiki/Special:FilePath/Ueda_Dentetsu_1004F_Round_Window_01.jpg?width=400","author":"Suikotei","license":"CC BY-SA 4.0","sourceUrl":"https://commons.wikimedia.org/wiki/File:Ueda_Dentetsu_1004F_Round_Window_01.jpg"}};

const map = L.map('map', { zoomControl: false }).setView([36.5, 138], 5);
L.control.zoom({ position: 'bottomright' }).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

const TYPE_COLORS = { scene: '#2a78d6', monument: '#eb6834', inspiration: '#1baf7a' };
const TYPE_LABELS = { scene: '実際の舞台', monument: '像・モニュメント', inspiration: '着想元' };

function createPinIcon(type) {
  const color = TYPE_COLORS[type];
  let shape;
  if (type === 'scene') {
    shape = `<circle cx="12" cy="12" r="7" fill="${color}" stroke="#ffffff" stroke-width="2"/>`;
  } else if (type === 'monument') {
    shape = `<rect x="5.5" y="5.5" width="13" height="13" fill="${color}" stroke="#ffffff" stroke-width="2"/>`;
  } else {
    shape = `<polygon points="12,4 20,19 4,19" fill="${color}" stroke="#ffffff" stroke-width="2"/>`;
  }
  return L.divIcon({
    className: 'pin-icon',
    html: `<svg width="24" height="24" viewBox="0 0 24 24">${shape}</svg>`,
    iconSize: [24, 24],
    iconAnchor: [12, 12]
  });
}

const clusterGroup = L.markerClusterGroup();
const markersById = {};

for (const spot of SPOTS) {
  const marker = L.marker([spot.lat, spot.lng], { icon: createPinIcon(spot.type) });
  markersById[spot.id] = marker;
  const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(spot.mapsQuery);
  const photo = PHOTOS[spot.id];
  const photoHtml = photo ? `
      <img class="photo" src="${photo.url}" alt="${spot.name}" loading="lazy">
      <p class="photo-credit">Photo: <a href="${photo.sourceUrl}" target="_blank" rel="noopener">${photo.author}</a> / ${photo.license} (Wikimedia Commons)</p>
  ` : '';
  marker.bindPopup(`
    <div class="spot-popup">
      <span class="badge">${TYPE_LABELS[spot.type]}</span>
      <h3>${spot.name}</h3>
      <p>${spot.anime}｜${spot.prefecture}</p>
      ${photoHtml}
      <p class="desc">${spot.description}</p>
      <a href="${mapsUrl}" target="_blank" rel="noopener">Googleマップで開く</a>
    </div>
  `);
  clusterGroup.addLayer(marker);
}

map.addLayer(clusterGroup);

const filterState = {
  animes: new Set(SPOTS.map(s => s.anime)),
  types: new Set(['scene', 'monument', 'inspiration'])
};

function buildAnimeFilter() {
  const container = document.getElementById('anime-filter');
  const animeList = [...new Set(SPOTS.map(s => s.anime))].sort();
  container.innerHTML = animeList.map(anime => `
    <label><input type="checkbox" value="${anime}" checked> ${anime}</label>
  `).join('');
  container.addEventListener('change', (e) => {
    if (e.target.matches('input[type=checkbox]')) {
      if (e.target.checked) filterState.animes.add(e.target.value);
      else filterState.animes.delete(e.target.value);
      applyFilters();
    }
  });
}

function buildTypeFilter() {
  document.querySelectorAll('.type-chip').forEach(chip => {
    chip.classList.add('active');
    chip.addEventListener('click', () => {
      const type = chip.dataset.type;
      if (filterState.types.has(type)) {
        filterState.types.delete(type);
        chip.classList.remove('active');
      } else {
        filterState.types.add(type);
        chip.classList.add('active');
      }
      applyFilters();
    });
  });
}

function applyFilters() {
  for (const spot of SPOTS) {
    const marker = markersById[spot.id];
    const visible = filterState.animes.has(spot.anime) && filterState.types.has(spot.type);
    const inCluster = clusterGroup.hasLayer(marker);
    if (visible && !inCluster) clusterGroup.addLayer(marker);
    if (!visible && inCluster) clusterGroup.removeLayer(marker);
  }
}

buildAnimeFilter();
buildTypeFilter();

function buildPrefNav() {
  const container = document.getElementById('pref-nav-list');
  container.innerHTML = PREFECTURE_NAV.map(p => `
    <div class="pref-nav-item" data-name="${p.name}">${p.name}（${p.count}）</div>
  `).join('');
  container.addEventListener('click', (e) => {
    const item = e.target.closest('.pref-nav-item');
    if (!item) return;
    const pref = PREFECTURE_NAV.find(p => p.name === item.dataset.name);
    if (pref) map.flyToBounds(pref.bounds, { padding: [40, 40], maxZoom: 14 });
  });
}

buildPrefNav();
</script>
</body>
