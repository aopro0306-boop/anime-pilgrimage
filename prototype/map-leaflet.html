<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: 'M PLUS Rounded 1c', sans-serif; }
  #map { width: 100%; height: 100vh; }
  #filter-panel{position:absolute;top:12px;left:12px;z-index:690;padding:14px;max-width:280px;background:rgba(255,255,255,0.97);border-radius:18px;max-height:70vh;overflow-y:auto;box-shadow:0 6px 20px rgba(47,128,255,0.18);}
  #anime-filter label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin:2px 0;padding:6px 10px;border-radius:12px;cursor:pointer;transition:background 0.15s ease;}
  #anime-filter label:hover{background:#f5f2ea;}
  #anime-filter input[type=checkbox]{width:16px;height:16px;accent-color:#FF4D6D;cursor:pointer;flex-shrink:0;}
  #anime-filter label.checked{background:#ffe3ea;color:#e8395a;}
  #lang-switcher{margin-bottom:8px;}
  #lang-select{width:100%;box-sizing:border-box;padding:7px 10px;font-size:13px;font-family:inherit;border:2px solid #e2ddd0;border-radius:12px;background:#fff;}
  #anime-search-box{margin-bottom:8px;}
  #anime-search-input{width:100%;box-sizing:border-box;padding:7px 10px;font-size:13px;font-family:inherit;border:2px solid #e2ddd0;border-radius:12px;}
  #anime-search-input:focus{outline:none;border-color:#2F80FF;}
  #anime-search-results{max-height:160px;overflow-y:auto;margin-top:4px;border:2px solid #f0ede4;border-radius:12px;}
  #anime-search-results.hidden{display:none;}
  .anime-search-result{padding:5px 8px;font-size:13px;cursor:pointer;}
  .anime-search-result:hover{background:#f0f0f0;}
  .type-chip{display:inline-block;margin:4px 4px 0 0;padding:5px 12px;border-radius:999px;border:2px solid #ddd;background:#fff;cursor:pointer;font-size:12px;font-family:inherit;font-weight:700;transition:transform 0.1s ease;}
  .type-chip:hover{transform:translateY(-1px);}
  .type-chip.active{color:#fff;border-color:transparent;}
  .type-chip[data-type="scene"].active{background:#2F80FF;}
  .type-chip[data-type="monument"].active{background:#FF6F3C;}
  .type-chip[data-type="inspiration"].active{background:#00C48C;}
  .favorite-heart{background:none;border:none;font-size:18px;cursor:pointer;float:right;line-height:1;padding:0;color:#FF4D6D;}
  .spot-popup{font-family:'M PLUS Rounded 1c', sans-serif;min-width:180px;}
  .spot-popup .badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;background:#eee;color:#555;margin-bottom:6px;}
  .spot-popup .badge.type-scene{background:#e4efff;color:#1a5fc4;}
  .spot-popup .badge.type-monument{background:#ffe9e0;color:#d94f1e;}
  .spot-popup .badge.type-inspiration{background:#dff8ee;color:#009468;}
  .spot-popup h3{margin:4px 0;font-size:15px;}
  .spot-popup p{margin:2px 0;font-size:13px;color:#555;}
  .spot-popup .desc{margin-top:6px;font-size:13px;color:#333;}
  .spot-popup a{display:inline-block;margin-top:8px;font-size:13px;}
  .spot-popup .gmaps-btn{background:#FF4D6D;color:#fff;text-decoration:none;padding:7px 16px;border-radius:999px;font-weight:700;font-size:12px;}
  .spot-popup .gmaps-btn:hover{background:#e8395a;}
  .spot-popup .photo{width:100%;max-width:240px;height:auto;border-radius:12px;display:block;margin-top:4px;}
  .spot-popup .photo-credit{margin-top:2px;font-size:10px;color:#999;}
  .spot-popup .photo-credit a{margin-top:0;font-size:10px;}
  #panel-tabs{display:flex;gap:6px;margin-bottom:8px;}
  .panel-tab{flex:1;padding:7px 0;font-size:12px;font-weight:700;font-family:inherit;border:2px solid #e2ddd0;border-radius:12px;background:#fff;cursor:pointer;color:#555;}
  .panel-tab.active{background:#FF4D6D;border-color:#FF4D6D;color:#fff;}
  #filter-tab-content.hidden, #favorites-tab-content.hidden{display:none;}
  .favorites-empty{font-size:13px;color:#888;padding:8px 4px;}
  #pref-nav{position:absolute;top:12px;right:12px;z-index:690;padding:14px;width:200px;max-height:70vh;overflow-y:auto;background:rgba(255,255,255,0.97);border-radius:18px;box-shadow:0 6px 20px rgba(47,128,255,0.18);}
  #pref-nav h4{margin:0 0 8px 0;font-size:13px;font-weight:800;}
  .pref-nav-item{padding:5px 8px;font-size:13px;cursor:pointer;border-radius:10px;}
  .pref-nav-item:hover{background:#e4efff;color:#1a5fc4;}
  .favorite-item{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;border-radius:12px;cursor:pointer;font-size:13px;}
  .favorite-item:hover{background:#f5f2ea;}
  .favorite-item .favorite-item-info{flex:1;min-width:0;}
  .favorite-item .favorite-item-name{font-weight:700;display:block;}
  .favorite-item .favorite-item-anime{font-size:11px;color:#888;display:block;}
  .favorite-remove-btn{background:none;border:none;font-size:16px;cursor:pointer;color:#999;padding:0 0 0 8px;flex-shrink:0;}
  .favorite-remove-btn:hover{color:#e8395a;}
  .favorite-item-actions{display:flex;align-items:center;gap:2px;flex-shrink:0;}
  .favorite-move-btn{background:none;border:none;font-size:14px;cursor:pointer;color:#999;padding:0 4px;}
  .favorite-move-btn:hover:not(:disabled){color:#1a5fc4;}
  .favorite-move-btn:disabled{opacity:0.25;cursor:default;}
  #route-actions{display:flex;flex-direction:column;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid #f0ede4;}
  #route-actions.hidden{display:none;}
  #route-actions button{border-radius:999px;padding:8px 0;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;border:2px solid #FF4D6D;}
  #view-route-btn{background:#FF4D6D;color:#fff;}
  #view-route-btn:hover{background:#e8395a;border-color:#e8395a;}
  #open-route-gmaps-btn{background:#fff;color:#FF4D6D;}
  #open-route-gmaps-btn:hover{background:#ffe3ea;}
  @media (max-width: 640px) {
    #filter-panel, #pref-nav { width: calc(50vw - 24px); max-width: none; box-sizing: border-box; }
  }
  #privacy-link{position:absolute;bottom:8px;left:8px;z-index:690;font-size:11px;background:rgba(255,255,255,0.85);padding:3px 8px;border-radius:8px;color:#555;text-decoration:none;}
  #privacy-link:hover{background:#fff;color:#1a5fc4;}
</style>

// OpenFreeMap: free, unlimited, no API key required (donation-funded),
// unlike raw tile.openstreetmap.org which prohibits production traffic
// without prior arrangement. Served as vector tiles via MapLibre GL,
// wrapped as a normal Leaflet layer so markers/clustering/zoom/flyTo
// all keep working exactly as before.
// maxZoom is set explicitly because L.maplibreGL (vector tiles) doesn't
// auto-populate it on the map the way L.tileLayer used to — leaving it
// unset makes map.getMaxZoom() return Infinity, which crashes
// leaflet.markercluster's onAdd() with "Map has no maxZoom specified"
// and halts the rest of the script (markers, search, pref nav all break).
const map = L.map('map', { zoomControl: false, minZoom: 1, maxZoom: 19 }).setView([36.5, 138], 5);
L.control.zoom({ position: 'bottomright' }).addTo(map);
L.maplibreGL({
  style: 'https://tiles.openfreemap.org/styles/liberty'
}).addTo(map);

// Favorites are stored client-side only (localStorage), keyed by spot id.
// No account/server sync — see design/2026-08-10-map-favorites-design.md.
const FAVORITES_KEY = 'pilgrimage-favorites';

let favorites;
try {
  favorites = new Set(JSON.parse(localStorage.getItem(FAVORITES_KEY) || '[]'));
} catch (e) {
  favorites = new Set();
}

function saveFavorites() {
  localStorage.setItem(FAVORITES_KEY, JSON.stringify([...favorites]));
}

// Called from the popup heart button (Task 3) and the favorites-tab remove
// button (Task 4). buildFavoritesTab isn't defined until Task 4, so the call
// is guarded until then.
function toggleFavorite(id) {
  if (favorites.has(id)) {
    favorites.delete(id);
  } else {
    favorites.add(id);
  }
  saveFavorites();
  if (typeof buildFavoritesTab === 'function') buildFavoritesTab();
}

const FAVORITES_ORDER_KEY = 'pilgrimage-favorites-order';

let favoritesOrder;
try {
  favoritesOrder = JSON.parse(localStorage.getItem(FAVORITES_ORDER_KEY) || '[]');
} catch (e) {
  favoritesOrder = [];
}

function saveFavoritesOrder() {
  localStorage.setItem(FAVORITES_ORDER_KEY, JSON.stringify(favoritesOrder));
}

// Reconciles favoritesOrder with the current favorites Set: keeps existing
// entries in their relative order, appends newly favorited ids at the end,
// and drops ids that were unfavorited. Called at the top of every
// buildFavoritesTab() render so favoritesOrder stays in sync without
// needing a separate hook into toggleFavorite().
function syncFavoritesOrder() {
  favoritesOrder = favoritesOrder.filter(id => favorites.has(id));
  for (const id of favorites) {
    if (!favoritesOrder.includes(id)) favoritesOrder.push(id);
  }
  saveFavoritesOrder();
}

function moveFavorite(id, direction) {
  const index = favoritesOrder.indexOf(id);
  const swapWith = index + direction;
  if (index === -1 || swapWith < 0 || swapWith >= favoritesOrder.length) return;
  [favoritesOrder[index], favoritesOrder[swapWith]] = [favoritesOrder[swapWith], favoritesOrder[index]];
  saveFavoritesOrder();
  buildFavoritesTab();
}

function translateDescription(spot) {
  if (currentLang === 'en' && SPOT_DESCRIPTIONS_EN[spot.id]) return SPOT_DESCRIPTIONS_EN[spot.id];
  return spot.description;
}

function createPinIcon(type) {
  const color = TYPE_COLORS[type];
  let mark;
  if (type === 'scene') {
    mark = `<circle cx="12" cy="10" r="4" fill="#ffffff"/>`;
  } else if (type === 'monument') {
    mark = `<rect x="8.5" y="6.5" width="7" height="7" fill="#ffffff"/>`;
  } else {
    mark = `<polygon points="12,5.5 16.3,12.5 7.7,12.5" fill="#ffffff"/>`;
  }
  // Pin/marker silhouette (rounded head + pointed tail) so the tip precisely
  // marks the coordinate, rather than a shape centered on the point.
  const html = `<svg width="24" height="32" viewBox="0 0 24 32">
    <polygon points="4.5,14 19.5,14 12,29" fill="${color}"/>
    <circle cx="12" cy="10" r="9" fill="${color}" stroke="#ffffff" stroke-width="1.5"/>
    ${mark}
  </svg>`;
  return L.divIcon({
    className: 'pin-icon',
    html,
    iconSize: [24, 32],
    iconAnchor: [12, 29],
    popupAnchor: [0, -29]
  });
}

const clusterGroup = L.markerClusterGroup();
const markersById = {};

// Popup content is built lazily (via a function passed to bindPopup, which
// Leaflet calls fresh every time the popup opens) so already-created
// markers automatically show the current language without being rebuilt.
function buildPopupHtml(spot) {
  const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(spot.mapsQuery);
  const photo = PHOTOS[spot.id];
  const name = translateSpotName(spot);
  const isFavorite = favorites.has(spot.id);
  const photoHtml = photo ? `
      <img class="photo" src="${photo.url}" alt="${name}" loading="lazy">
      <p class="photo-credit">Photo: <a href="${photo.sourceUrl}" target="_blank" rel="noopener">${photo.author}</a> / ${photo.license} (Wikimedia Commons)</p>
  ` : '';
  return `
    <div class="spot-popup">
      <button class="favorite-heart" type="button" data-favorite-id="${spot.id}" aria-label="${I18N[currentLang].favoriteToggle}">${isFavorite ? '♥' : '♡'}</button>
      <span class="badge type-${spot.type}">${I18N[currentLang].types[spot.type]}</span>
      <h3>${name}</h3>
      <p>${translateAnime(spot.anime)}${currentLang === 'en' ? ' | ' : '｜'}${translatePrefecture(spot.prefecture)}</p>
      ${photoHtml}
      <p class="desc">${translateDescription(spot)}</p>
      <a class="gmaps-btn" href="${mapsUrl}" target="_blank" rel="noopener">${I18N[currentLang].openInGoogleMaps}</a>
    </div>
  `;
}

for (const spot of SPOTS) {
  const marker = L.marker([spot.lat, spot.lng], { icon: createPinIcon(spot.type) });
  markersById[spot.id] = marker;
  marker.bindPopup(() => buildPopupHtml(spot));
  clusterGroup.addLayer(marker);
}

map.addLayer(clusterGroup);

// Popup content is regenerated by buildPopupHtml() every time Leaflet
// opens a popup (see marker.bindPopup(() => buildPopupHtml(spot)) above),
// so the heart button's click listener must be re-attached on every open
// rather than once at page load.
map.on('popupopen', (e) => {
  const el = e.popup.getElement();
  if (!el) return;
  const btn = el.querySelector('.favorite-heart');
  if (!btn) return;
  btn.addEventListener('click', () => {
    const id = btn.dataset.favoriteId;
    toggleFavorite(id);
    btn.textContent = favorites.has(id) ? '♥' : '♡';
  });
});

const filterState = {
  // Empty = no restriction (show every anime). Checking a box narrows the
  // map down to only the checked anime(s).
  animes: new Set(),
  types: new Set(['scene', 'monument', 'inspiration'])
};

// Re-run whenever the language changes (see applyLanguage()) so anime
// titles switch to their English localization. Checked state is restored
// from filterState.animes (unaffected by the rebuild), and the change
// listener is wired separately (wireAnimeFilter) so it isn't re-attached
// on every rebuild.
function buildAnimeFilter() {
  const container = document.getElementById('anime-filter');
  const animeList = [...new Set(SPOTS.map(s => s.anime))].sort();
  container.innerHTML = animeList.map(anime => {
    const checked = filterState.animes.has(anime);
    return `<label class="${checked ? 'checked' : ''}"><input type="checkbox" value="${anime}"${checked ? ' checked' : ''}> ${translateAnime(anime)}</label>`;
  }).join('');
}

function wireAnimeFilter() {
  const container = document.getElementById('anime-filter');
  container.addEventListener('change', (e) => {
    if (e.target.matches('input[type=checkbox]')) {
      e.target.closest('label').classList.toggle('checked', e.target.checked);
      if (e.target.checked) filterState.animes.add(e.target.value);
      else filterState.animes.delete(e.target.value);
      applyFilters();
    }
  });
}

function buildTypeFilter() {
  document.querySelectorAll('.type-chip').forEach(chip => {
    chip.classList.add('active');
    chip.addEventListener('click', () => {
      const type = chip.dataset.type;
      if (filterState.types.has(type)) {
        filterState.types.delete(type);
        chip.classList.remove('active');
      } else {
        filterState.types.add(type);
        chip.classList.add('active');
      }
      applyFilters();
    });
  });
}

function applyFilters() {
  for (const spot of SPOTS) {
    const marker = markersById[spot.id];
    const animeOk = filterState.animes.size === 0 || filterState.animes.has(spot.anime);
    const visible = animeOk && filterState.types.has(spot.type);
    const inCluster = clusterGroup.hasLayer(marker);
    if (visible && !inCluster) clusterGroup.addLayer(marker);
    if (!visible && inCluster) clusterGroup.removeLayer(marker);
  }
}

buildAnimeFilter();
wireAnimeFilter();
buildTypeFilter();

function zoomToAnime(animeName) {
  const matching = SPOTS.filter(s => s.anime === animeName);
  if (matching.length === 0) return;
  let minLat = 90, maxLat = -90, minLng = 180, maxLng = -180;
  for (const s of matching) {
    if (s.lat < minLat) minLat = s.lat;
    if (s.lat > maxLat) maxLat = s.lat;
    if (s.lng < minLng) minLng = s.lng;
    if (s.lng > maxLng) maxLng = s.lng;
  }
  map.flyToBounds([[minLat, minLng], [maxLat, maxLng]], { padding: [40, 40], maxZoom: 14 });
}

function buildAnimeSearch() {
  const input = document.getElementById('anime-search-input');
  const results = document.getElementById('anime-search-results');
  const animeList = [...new Set(SPOTS.map(s => s.anime))].sort();

  function renderResults(query) {
    if (!query) {
      results.innerHTML = '';
      results.classList.add('hidden');
      return;
    }
    const q = query.toLowerCase();
    const matches = animeList.filter(a => a.toLowerCase().includes(q) || translateAnime(a).toLowerCase().includes(q));
    results.innerHTML = matches.map(a => `<div class="anime-search-result" data-anime="${a}">${translateAnime(a)}</div>`).join('');
    results.classList.toggle('hidden', matches.length === 0);
  }

  input.addEventListener('input', () => renderResults(input.value.trim()));

  results.addEventListener('click', (e) => {
    const item = e.target.closest('.anime-search-result');
    if (!item) return;
    zoomToAnime(item.dataset.anime);
    input.value = '';
    results.innerHTML = '';
    results.classList.add('hidden');
  });
}

buildAnimeSearch();

  const container = document.getElementById('pref-nav-list');
  container.innerHTML = PREFECTURE_NAV.map(p => `
    <div class="pref-nav-item" data-name="${p.name}">${translatePrefecture(p.name)}${currentLang === 'en' ? ` (${p.count})` : `（${p.count}）`}</div>
  `).join('');
}

function wirePrefNav() {
  const container = document.getElementById('pref-nav-list');
  container.addEventListener('click', (e) => {
    const item = e.target.closest('.pref-nav-item');
    if (!item) return;
    const pref = PREFECTURE_NAV.find(p => p.name === item.dataset.name);
    if (pref) map.flyToBounds(pref.bounds, { padding: [40, 40], maxZoom: 14 });
  });
}

buildPrefNav();
wirePrefNav();

// Same build/wire split as buildAnimeFilter/buildPrefNav: buildFavoritesTab
// only renders (called again from applyLanguage() and toggleFavorite()),
// wireFavoritesTab attaches the one-time delegated click listener.
function buildFavoritesTab() {
  syncFavoritesOrder();
  const container = document.getElementById('favorites-list');
  const favSpots = favoritesOrder.map(id => SPOTS.find(s => s.id === id)).filter(Boolean);
  if (favSpots.length === 0) {
    container.innerHTML = `<p class="favorites-empty">${I18N[currentLang].favoritesEmpty}</p>`;
    document.getElementById('route-actions')?.classList.add('hidden');
    return;
  }
  container.innerHTML = favSpots.map((s, i) => `
    <div class="favorite-item" data-id="${s.id}">
      <div class="favorite-item-info">
        <span class="favorite-item-name">${translateSpotName(s)}</span>
        <span class="favorite-item-anime">${translateAnime(s.anime)}</span>
      </div>
      <div class="favorite-item-actions">
        <button class="favorite-move-btn" type="button" data-move-id="${s.id}" data-direction="-1" aria-label="${I18N[currentLang].moveUp}"${i === 0 ? ' disabled' : ''}>↑</button>
        <button class="favorite-move-btn" type="button" data-move-id="${s.id}" data-direction="1" aria-label="${I18N[currentLang].moveDown}"${i === favSpots.length - 1 ? ' disabled' : ''}>↓</button>
        <button class="favorite-remove-btn" type="button" data-remove-id="${s.id}" aria-label="${I18N[currentLang].removeFavorite}">×</button>
      </div>
    </div>
  `).join('');
  document.getElementById('route-actions')?.classList.toggle('hidden', favSpots.length < 2);
}

function wireFavoritesTab() {
  const container = document.getElementById('favorites-list');
  container.addEventListener('click', (e) => {
    const moveBtn = e.target.closest('.favorite-move-btn');
    if (moveBtn) {
      moveFavorite(moveBtn.dataset.moveId, Number(moveBtn.dataset.direction));
      return;
    }
    const removeBtn = e.target.closest('.favorite-remove-btn');
    if (removeBtn) {
      toggleFavorite(removeBtn.dataset.removeId);
      return;
    }
    const item = e.target.closest('.favorite-item');
    if (item) {
      const spot = SPOTS.find(s => s.id === item.dataset.id);
      if (spot) {
        map.flyTo([spot.lat, spot.lng], 15);
        markersById[spot.id].openPopup();
      }
    }
  });
}

buildFavoritesTab();
wireFavoritesTab();

let routeLine = null;

function viewRouteOnMap() {
  syncFavoritesOrder();
  const latlngs = favoritesOrder.map(id => {
    const s = SPOTS.find(sp => sp.id === id);
    return [s.lat, s.lng];
  });
  if (routeLine) map.removeLayer(routeLine);
  routeLine = L.polyline(latlngs, { color: '#FF4D6D', weight: 3, dashArray: '6, 8' }).addTo(map);
  map.fitBounds(routeLine.getBounds(), { padding: [40, 40] });
}

function openRouteInGoogleMaps() {
  syncFavoritesOrder();
  const spots = favoritesOrder.map(id => SPOTS.find(s => s.id === id));
  const origin = `${spots[0].lat},${spots[0].lng}`;
  const destination = `${spots[spots.length - 1].lat},${spots[spots.length - 1].lng}`;
  const waypoints = spots.slice(1, -1).map(s => `${s.lat},${s.lng}`).join('|');
  let url = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}`;
  if (waypoints) url += `&waypoints=${encodeURIComponent(waypoints)}`;
  window.open(url, '_blank', 'noopener');
}

document.getElementById('view-route-btn').addEventListener('click', viewRouteOnMap);
document.getElementById('open-route-gmaps-btn').addEventListener('click', openRouteInGoogleMaps);

// Updates the static filter-panel/pref-nav chrome. Already-open or
// future popups pick up the new language on their own since buildPopupHtml
// reads currentLang live each time Leaflet calls it.
function applyLanguage(lang) {
  currentLang = lang;
  document.title = I18N[lang].title;
  document.documentElement.lang = lang;
  document.getElementById('anime-search-input').placeholder = I18N[lang].searchPlaceholder;
  document.querySelectorAll('.type-chip').forEach(chip => {
    chip.textContent = I18N[lang].types[chip.dataset.type];
  });
  document.querySelector('#pref-nav h4').textContent = I18N[lang].prefNavHeader;
  document.getElementById('privacy-link').textContent = I18N[lang].privacyLink;
  document.querySelector('.panel-tab[data-tab="filter"]').textContent = I18N[lang].filterTab;
  document.querySelector('.panel-tab[data-tab="favorites"]').textContent = '♡ ' + I18N[lang].favoritesTab;
  document.getElementById('view-route-btn').textContent = I18N[lang].viewRouteOnMap;
  document.getElementById('open-route-gmaps-btn').textContent = I18N[lang].openRouteInGoogleMaps;
  buildAnimeFilter();
  buildPrefNav();
  buildFavoritesTab();
}

document.querySelectorAll('.panel-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.panel-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('filter-tab-content').classList.toggle('hidden', tab.dataset.tab !== 'filter');
    document.getElementById('favorites-tab-content').classList.toggle('hidden', tab.dataset.tab !== 'favorites');
  });
});

document.getElementById('lang-select').addEventListener('change', (e) => {
  applyLanguage(e.target.value);
});

// This site targets overseas visitors, so the default language is detected
// from the browser rather than always starting in Japanese. Falls back to
// English (rather than Japanese) for any language this site doesn't support.
function detectBrowserLang() {
  const supported = ['ja', 'en', 'zh-TW', 'ko', 'th', 'fr'];
  const browserLangs = navigator.languages || [navigator.language || 'en'];
  for (const bl of browserLangs) {
    const lower = bl.toLowerCase();
    const exact = supported.find(s => s.toLowerCase() === lower);
    if (exact) return exact;
    const base = lower.split('-')[0];
    if (base === 'zh') return 'zh-TW';
    const baseMatch = supported.find(s => s.toLowerCase() === base);
    if (baseMatch) return baseMatch;
  }
  return 'en';
}

applyLanguage(detectBrowserLang());
</script>
