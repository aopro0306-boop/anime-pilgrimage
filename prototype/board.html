<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, getDocs, query, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCOHzUTjYPtL1GOzWIvB0RUIdOL2TWIT_0",
  authDomain: "anime-pilgrimage-729da.firebaseapp.com",
  projectId: "anime-pilgrimage-729da",
  storageBucket: "anime-pilgrimage-729da.firebasestorage.app",
  messagingSenderId: "725181284483",
  appId: "1:725181284483:web:be4acc204f92e991779bb6"
};

const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);
const auth = getAuth(firebaseApp);
const googleProvider = new GoogleAuthProvider();

// Exposed on window so the site's existing classic (non-module) script
// below can call these without itself becoming a module. Posting requires
// being signed in (see window.firebaseAuth); edit/delete are further
// restricted server-side by Firestore security rules to the post's own
// ownerId, so the checks here are for UX only, not the real guard.
window.firebaseAuth = {
  // Tries the popup flow first (no page reload); if the browser silently
  // blocked the popup rather than showing it, falls back to a full-page
  // redirect instead, which popup blockers can't stop. getRedirectResult()
  // below completes that flow when the page reloads afterward.
  signInWithGoogle: async () => {
    try {
      await signInWithPopup(auth, googleProvider);
    } catch (err) {
      if (err.code === 'auth/popup-blocked') {
        await signInWithRedirect(auth, googleProvider);
        return;
      }
      throw err;
    }
  },
  signOutUser: () => signOut(auth),
  getCurrentUser: () => auth.currentUser,
  onAuthChange: (cb) => onAuthStateChanged(auth, cb)
};

getRedirectResult(auth).catch((err) => console.error('Google redirect sign-in failed:', err));

window.firebaseComments = {
  async addBoardPost(name, message) {
    const user = auth.currentUser;
    if (!user) throw new Error('not-signed-in');
    await addDoc(collection(db, 'boardPosts'), {
      name: name || '', message, createdAt: serverTimestamp(), ownerId: user.uid
    });
  },
  async getBoardPosts() {
    const q = query(collection(db, 'boardPosts'), orderBy('createdAt', 'desc'), limit(30));
    const snap = await getDocs(q);
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  },
  async updateBoardPost(postId, message) {
    await updateDoc(doc(db, 'boardPosts', postId), { message });
  },
  async deleteBoardPost(postId) {
    await deleteDoc(doc(db, 'boardPosts', postId));
  }
};

// This module script is deferred, so it runs *after* the page's own
// classic inline <script> has already executed during parsing — wait for
// this event rather than assuming window.firebaseComments/firebaseAuth
// already exist.
window.__firebaseReady = true;
window.dispatchEvent(new Event('firebase-ready'));
</script>

let currentLang = 'ja';

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

let boardPostsCache = [];

function renderBoardPosts(posts, currentUserId) {
  const listEl = document.getElementById('board-list');
  if (posts.length === 0) {
    listEl.innerHTML = `<p class="board-empty">${I18N[currentLang].boardEmpty}</p>`;
    return;
  }
  listEl.innerHTML = posts.map(p => {
    const isOwner = currentUserId && p.ownerId === currentUserId;
    const ownerActions = isOwner ? `
      <div class="board-post-owner-actions">
        <button class="board-edit-btn" type="button">${I18N[currentLang].editLabel}</button>
        <button class="board-delete-btn" type="button">${I18N[currentLang].deleteLabel}</button>
      </div>` : '';
    return `
    <div class="board-post" data-id="${p.id}">
      <span class="board-post-name">${escapeHtml(p.name || I18N[currentLang].boardAnonymous)}</span>
      <p class="board-post-message">${escapeHtml(p.message)}</p>
      ${ownerActions}
    </div>`;
  }).join('');
}

// The bulletin board's posts live in Firestore (see window.firebaseComments,
// set up by the module <script> above), so both the initial list and
// post-submit refresh are async network calls.
async function refreshBoard() {
  const listEl = document.getElementById('board-list');
  if (!window.firebaseComments) return;
  try {
    const posts = await window.firebaseComments.getBoardPosts();
    boardPostsCache = posts;
    const user = window.firebaseAuth.getCurrentUser();
    renderBoardPosts(posts, user && user.uid);
  } catch (e) {
    listEl.innerHTML = `<p class="board-empty">${I18N[currentLang].boardError}</p>`;
  }
}

// Shows a Google sign-in button when logged out, or the post form (plus a
// sign-out link) when logged in. Re-rendered after every sign-in/sign-out
// and on language change.
function renderBoardPostArea() {
  if (!window.firebaseAuth) return;
  const areaEl = document.getElementById('board-post-area');
  const user = window.firebaseAuth.getCurrentUser();
  if (!user) {
    areaEl.innerHTML = `<button class="auth-signin-btn" type="button">${I18N[currentLang].authSignIn}</button>`;
    areaEl.querySelector('.auth-signin-btn').addEventListener('click', async () => {
      try {
        await window.firebaseAuth.signInWithGoogle();
        renderBoardPostArea();
        await refreshBoard();
      } catch (e) {
        if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') {
          console.error('Google sign-in failed:', e);
          alert(I18N[currentLang].authError);
        }
      }
    });
    return;
  }
  areaEl.innerHTML = `
    <p class="auth-status">${I18N[currentLang].authSignedInAs.replace('{name}', escapeHtml(user.displayName || ''))} · <button class="auth-signout-btn" type="button">${I18N[currentLang].authSignOut}</button></p>
    <form id="board-form">
      <label>
        <span>${I18N[currentLang].boardNameLabel}</span>
        <input type="text" id="board-name-input" maxlength="30" value="${escapeHtml(user.displayName || '')}">
      </label>
      <label>
        <span>${I18N[currentLang].boardMessageLabel}</span>
        <textarea id="board-message-input" maxlength="300" required rows="4"></textarea>
      </label>
      <input type="text" id="board-honeypot" class="honeypot-field" tabindex="-1" autocomplete="off">
      <button type="submit" class="cta-button">${I18N[currentLang].boardSubmit}</button>
      <p id="board-status" class="contact-status hidden"></p>
    </form>
  `;
  areaEl.querySelector('.auth-signout-btn').addEventListener('click', async () => {
    await window.firebaseAuth.signOutUser();
    renderBoardPostArea();
    await refreshBoard();
  });
  const boardForm = document.getElementById('board-form');
  boardForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (document.getElementById('board-honeypot').value) return;
    const messageInput = document.getElementById('board-message-input');
    const message = messageInput.value.trim();
    if (!message) return;
    const name = document.getElementById('board-name-input').value.trim();
    const status = document.getElementById('board-status');
    const submitBtn = boardForm.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    status.classList.remove('hidden', 'success', 'error');
    try {
      await window.firebaseComments.addBoardPost(name, message);
      messageInput.value = '';
      status.textContent = I18N[currentLang].boardPosted;
      status.classList.add('success');
      await refreshBoard();
      if (typeof gtag === 'function') {
        gtag('event', 'post_board_comment');
      }
    } catch (err) {
      status.textContent = I18N[currentLang].boardError;
      status.classList.add('error');
    } finally {
      submitBtn.disabled = false;
    }
  });
}

document.getElementById('board-list').addEventListener('click', async (e) => {
  const item = e.target.closest('.board-post');
  if (!item) return;
  const postId = item.dataset.id;

  if (e.target.closest('.board-edit-btn')) {
    const messageEl = item.querySelector('.board-post-message');
    const currentText = messageEl.textContent;
    const actionsEl = item.querySelector('.board-post-owner-actions');
    messageEl.outerHTML = `<textarea class="board-edit-textarea" maxlength="300">${escapeHtml(currentText)}</textarea>`;
    actionsEl.innerHTML = `
      <button class="board-save-btn" type="button">${I18N[currentLang].saveLabel}</button>
      <button class="board-cancel-btn" type="button">${I18N[currentLang].cancelLabel}</button>
    `;
    return;
  }
  if (e.target.closest('.board-cancel-btn')) {
    await refreshBoard();
    return;
  }
  if (e.target.closest('.board-save-btn')) {
    const textarea = item.querySelector('.board-edit-textarea');
    const newMessage = textarea.value.trim();
    if (!newMessage) return;
    try {
      await window.firebaseComments.updateBoardPost(postId, newMessage);
      await refreshBoard();
    } catch (err) {
      alert(I18N[currentLang].boardError);
    }
    return;
  }
  if (e.target.closest('.board-delete-btn')) {
    if (!confirm(I18N[currentLang].deleteConfirm)) return;
    try {
      await window.firebaseComments.deleteBoardPost(postId);
      await refreshBoard();
    } catch (err) {
      alert(I18N[currentLang].boardError);
    }
  }
});

function applyLang(lang) {
  currentLang = lang;
  document.documentElement.lang = lang;
  document.title = I18N[lang].pageTitle;
  document.querySelector('.map-link').textContent = I18N[lang].mapNav;
  document.getElementById('board-page-heading').textContent = I18N[lang].boardHeading;
  document.getElementById('board-page-intro').textContent = I18N[lang].boardIntro;
  document.getElementById('back-link-text').textContent = I18N[lang].backLink;
  document.getElementById('lang-select').value = lang;
  renderBoardPosts(boardPostsCache, window.firebaseAuth?.getCurrentUser()?.uid);
  if (window.firebaseAuth) renderBoardPostArea();
}

document.getElementById('lang-select').addEventListener('change', (e) => {
  applyLang(e.target.value);
});

// This site targets overseas visitors, so the default language is detected
// from the browser rather than always starting in Japanese.
function detectBrowserLang() {
  const supported = ['ja', 'en', 'zh-TW', 'ko', 'th', 'fr'];
  const browserLangs = navigator.languages || [navigator.language || 'en'];
  for (const bl of browserLangs) {
    const lower = bl.toLowerCase();
    const exact = supported.find(s => s.toLowerCase() === lower);
    if (exact) return exact;
    const base = lower.split('-')[0];
    if (base === 'zh') return 'zh-TW';
    const baseMatch = supported.find(s => s.toLowerCase() === base);
    if (baseMatch) return baseMatch;
  }
  return 'en';
}

// The Firebase module <script> above is deferred, so it hasn't set
// window.firebaseComments/firebaseAuth yet at this point in the initial
// parse — wait for its 'firebase-ready' signal before the first render.
function firebaseReadyPromise() {
  if (window.__firebaseReady) return Promise.resolve();
  return new Promise(resolve => window.addEventListener('firebase-ready', resolve, { once: true }));
}
firebaseReadyPromise().then(() => {
  renderBoardPostArea();
  refreshBoard();
});

applyLang(detectBrowserLang());
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/anime-pilgrimage/sw.js').catch(() => {});
  });
}
</script>
