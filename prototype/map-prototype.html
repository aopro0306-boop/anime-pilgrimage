<style>
:root{
  --bg:#f9f9f7;
  --surface:#fcfcfb;
  --surface-translucent:rgba(252,251,251,0.92);
  --text-primary:#0b0b0b;
  --text-secondary:#52514e;
  --text-muted:#898781;
  --border:rgba(11,11,11,0.10);
  --gridline:#e1e0d9;
  --baseline:#c3c2b7;
  --shadow:rgba(11,11,11,0.20);
  --prefecture-fill:#e9e8e2;
  --prefecture-stroke:#c3c2b7;
  --pin-stroke:#fcfcfb;
  --pin-scene:#2a78d6;
  --pin-monument:#eb6834;
  --pin-inspiration:#1baf7a;
  --chip-bg:#ffffff;
  --chip-border:#c3c2b7;
  --chip-text:#0b0b0b;
  --chip-active-bg:#0b0b0b;
  --chip-active-text:#fcfcfb;
  --badge-bg:#e1e0d9;
  --badge-text:#52514e;
  --hover-bg:#f2f1ec;
  --divider:#e1e0d9;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d0d0d;
    --surface:#1a1a19;
    --surface-translucent:rgba(26,26,25,0.92);
    --text-primary:#ffffff;
    --text-secondary:#c3c2b7;
    --text-muted:#898781;
    --border:rgba(255,255,255,0.10);
    --gridline:#2c2c2a;
    --baseline:#383835;
    --shadow:rgba(0,0,0,0.5);
    --prefecture-fill:#232322;
    --prefecture-stroke:#3a3a38;
    --pin-stroke:#1a1a19;
    --pin-scene:#3987e5;
    --pin-monument:#d95926;
    --pin-inspiration:#199e70;
    --chip-bg:#232322;
    --chip-border:#3a3a38;
    --chip-text:#ffffff;
    --chip-active-bg:#ffffff;
    --chip-active-text:#1a1a19;
    --badge-bg:#2c2c2a;
    --badge-text:#c3c2b7;
    --hover-bg:#232322;
    --divider:#2c2c2a;
  }
}
:root[data-theme="dark"]{
  --bg:#0d0d0d;
  --surface:#1a1a19;
  --surface-translucent:rgba(26,26,25,0.92);
  --text-primary:#ffffff;
  --text-secondary:#c3c2b7;
  --text-muted:#898781;
  --border:rgba(255,255,255,0.10);
  --gridline:#2c2c2a;
  --baseline:#383835;
  --shadow:rgba(0,0,0,0.5);
  --prefecture-fill:#232322;
  --prefecture-stroke:#3a3a38;
  --pin-stroke:#1a1a19;
  --pin-scene:#3987e5;
  --pin-monument:#d95926;
  --pin-inspiration:#199e70;
  --chip-bg:#232322;
  --chip-border:#3a3a38;
  --chip-text:#ffffff;
  --chip-active-bg:#ffffff;
  --chip-active-text:#1a1a19;
  --badge-bg:#2c2c2a;
  --badge-text:#c3c2b7;
  --hover-bg:#232322;
  --divider:#2c2c2a;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text-primary);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}
#map-root{width:100%;height:100vh;background:var(--bg);}
.prefecture{fill:var(--prefecture-fill);stroke:var(--prefecture-stroke);stroke-width:1;cursor:pointer;transition:fill 0.15s ease;}
.prefecture:hover{fill:var(--gridline);}
.pin{fill:var(--text-muted);stroke:var(--pin-stroke);stroke-width:1.5;cursor:pointer;transition:r 0.15s ease,opacity 0.15s ease;}
.pin[data-type="scene"]{fill:var(--pin-scene);}
.pin[data-type="monument"]{fill:var(--pin-monument);}
.pin[data-type="inspiration"]{fill:var(--pin-inspiration);}
#filter-panel{position:absolute;top:0;left:0;z-index:10;padding:12px;max-width:280px;background:var(--surface-translucent);border-radius:8px;margin:12px;max-height:80vh;overflow-y:auto;box-shadow:0 4px 16px var(--shadow);border:1px solid var(--border);color:var(--text-primary);}
#anime-filter label{display:block;font-size:13px;margin:2px 0;color:var(--text-secondary);}
.type-chip{display:inline-block;margin:4px 4px 0 0;padding:4px 10px;border-radius:999px;border:1px solid var(--chip-border);background:var(--chip-bg);color:var(--chip-text);cursor:pointer;font-size:12px;transition:background 0.15s ease,color 0.15s ease;}
.type-chip.active{background:var(--chip-active-bg);color:var(--chip-active-text);border-color:var(--chip-active-bg);}
.pin.hidden{display:none;}
#detail-card{position:absolute;right:12px;top:12px;z-index:20;width:280px;padding:16px;background:var(--surface);color:var(--text-primary);border-radius:8px;box-shadow:0 4px 16px var(--shadow);border:1px solid var(--border);}
#detail-card.hidden{display:none;}
#detail-close{position:absolute;top:8px;right:8px;border:none;background:none;font-size:16px;cursor:pointer;color:var(--text-secondary);}
#detail-type-badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--badge-bg);color:var(--badge-text);margin-bottom:6px;}
#detail-maps-link{display:inline-block;margin-top:8px;font-size:13px;color:var(--pin-scene);}
#side-panel{position:absolute;left:12px;bottom:12px;top:auto;z-index:15;width:280px;max-height:60vh;overflow-y:auto;padding:12px;background:var(--surface);color:var(--text-primary);border-radius:8px;box-shadow:0 4px 16px var(--shadow);border:1px solid var(--border);}
#side-panel.hidden{display:none;}
#reset-zoom{display:block;margin-bottom:8px;border:none;background:var(--gridline);color:var(--text-primary);border-radius:6px;padding:6px 10px;cursor:pointer;font-size:12px;}
.side-panel-item{padding:6px 4px;border-bottom:1px solid var(--divider);cursor:pointer;font-size:13px;color:var(--text-primary);}
.side-panel-item:hover{background:var(--hover-bg);}
.pin.emphasized{r:6;stroke-width:2.5;}
.pin.dimmed{opacity:0.25;}
@media (max-width:640px){
  #filter-panel{max-width:calc(100vw - 24px);margin:8px;padding:10px;max-height:40vh;}
  #side-panel{width:calc(100vw - 24px);left:8px;right:8px;bottom:8px;padding:10px;max-height:35vh;}
  #detail-card{width:calc(100vw - 24px);left:8px;right:8px;top:8px;padding:12px;}
}
</style>

</div>

</div>

</div>

function project(lat, lng) {
  return {
    x: (lng - PROJECTION.minLng) * PROJECTION.cosAvg * PROJECTION.scale,
    y: (PROJECTION.maxLat - lat) * PROJECTION.scale
  };
}

const SVG_NS = 'http://www.w3.org/2000/svg';

function renderMap() {
  const svg = document.getElementById('map-svg');
  svg.innerHTML = '';

  const prefLayer = document.createElementNS(SVG_NS, 'g');
  prefLayer.setAttribute('id', 'prefecture-layer');
  for (const pref of PREFECTURES) {
    const path = document.createElementNS(SVG_NS, 'path');
    path.setAttribute('class', 'prefecture');
    path.setAttribute('data-pref-id', pref.id);
    path.setAttribute('data-pref-name', pref.name);
    path.setAttribute('d', pref.path);
    prefLayer.appendChild(path);
  }
  svg.appendChild(prefLayer);

  const pinLayer = document.createElementNS(SVG_NS, 'g');
  pinLayer.setAttribute('id', 'pin-layer');
  for (const spot of SPOTS) {
    const { x, y } = project(spot.lat, spot.lng);
    const circle = document.createElementNS(SVG_NS, 'circle');
    circle.setAttribute('class', 'pin');
    circle.setAttribute('data-spot-id', spot.id);
    circle.setAttribute('data-type', spot.type);
    circle.setAttribute('data-anime', spot.anime);
    circle.setAttribute('data-pref-name', spot.prefecture);
    circle.setAttribute('cx', x.toFixed(1));
    circle.setAttribute('cy', y.toFixed(1));
    circle.setAttribute('r', '4');
    pinLayer.appendChild(circle);
  }
  svg.appendChild(pinLayer);
}

renderMap();

const filterState = {
  animes: new Set(SPOTS.map(s => s.anime)),
  types: new Set(['scene', 'monument', 'inspiration'])
};

function buildAnimeFilter() {
  const container = document.getElementById('anime-filter');
  const animeList = [...new Set(SPOTS.map(s => s.anime))].sort();
  container.innerHTML = animeList.map(anime => `
    <label><input type="checkbox" value="${anime}" checked> ${anime}</label>
  `).join('');
  container.addEventListener('change', (e) => {
    if (e.target.matches('input[type=checkbox]')) {
      if (e.target.checked) filterState.animes.add(e.target.value);
      else filterState.animes.delete(e.target.value);
      applyFilters();
    }
  });
}

function buildTypeFilter() {
  document.querySelectorAll('.type-chip').forEach(chip => {
    chip.classList.add('active');
    chip.addEventListener('click', () => {
      const type = chip.dataset.type;
      if (filterState.types.has(type)) {
        filterState.types.delete(type);
        chip.classList.remove('active');
      } else {
        filterState.types.add(type);
        chip.classList.add('active');
      }
      applyFilters();
    });
  });
}

function applyFilters() {
  document.querySelectorAll('.pin').forEach(pin => {
    const anime = pin.dataset.anime;
    const type = pin.dataset.type;
    const visible = filterState.animes.has(anime) && filterState.types.has(type);
    pin.classList.toggle('hidden', !visible);
  });
}

buildAnimeFilter();
buildTypeFilter();

const TYPE_LABELS = { scene: '実際の舞台', monument: '像・モニュメント', inspiration: '着想元' };

function showDetailCard(spotId) {
  const spot = SPOTS.find(s => s.id === spotId);
  if (!spot) return;
  document.getElementById('detail-type-badge').textContent = TYPE_LABELS[spot.type];
  document.getElementById('detail-name').textContent = spot.name;
  document.getElementById('detail-anime').textContent = spot.anime;
  document.getElementById('detail-prefecture').textContent = spot.prefecture;
  document.getElementById('detail-description').textContent = spot.description;
  document.getElementById('detail-maps-link').href =
    'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(spot.mapsQuery);
  document.getElementById('detail-card').classList.remove('hidden');
}

function hideDetailCard() {
  document.getElementById('detail-card').classList.add('hidden');
}

document.getElementById('map-svg').addEventListener('click', (e) => {
  if (e.target.matches('.pin')) showDetailCard(e.target.dataset.spotId);
});
document.getElementById('detail-close').addEventListener('click', hideDetailCard);

// SVGのviewBox属性はCSS transitionでは確実にアニメーションしないため、
// requestAnimationFrameで数値を補間してアニメーション遷移させる。
function animateViewBox(svg, toBox, duration = 400) {
  const current = svg.getAttribute('viewBox').split(' ').map(Number);
  const from = { x: current[0], y: current[1], w: current[2], h: current[3] };
  const start = performance.now();

  function step(now) {
    const t = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - t, 3); // ease-out cubic
    const x = from.x + (toBox.x - from.x) * eased;
    const y = from.y + (toBox.y - from.y) * eased;
    const w = from.w + (toBox.w - from.w) * eased;
    const h = from.h + (toBox.h - from.h) * eased;
    svg.setAttribute('viewBox', `${x.toFixed(1)} ${y.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}`);
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function zoomToPrefecture(prefName) {
  const pref = PREFECTURES.find(p => p.name === prefName);
  if (!pref) return;
  const svg = document.getElementById('map-svg');
  const padding = (pref.bbox.maxX - pref.bbox.minX) * 0.15 + 10;
  animateViewBox(svg, {
    x: pref.bbox.minX - padding,
    y: pref.bbox.minY - padding,
    w: (pref.bbox.maxX - pref.bbox.minX) + padding * 2,
    h: (pref.bbox.maxY - pref.bbox.minY) + padding * 2
  });

  document.querySelectorAll('.pin').forEach(pin => {
    const inPref = pin.dataset.prefName === prefName;
    pin.classList.toggle('emphasized', inPref);
    pin.classList.toggle('dimmed', !inPref);
  });

  const sidePanel = document.getElementById('side-panel');
  document.getElementById('side-panel-title').textContent = prefName + 'のスポット';
  const list = SPOTS.filter(s => s.prefecture === prefName);
  document.getElementById('side-panel-list').innerHTML = list.map(s => `
    <div class="side-panel-item" data-spot-id="${s.id}">${s.name}（${s.anime}）</div>
  `).join('');
  sidePanel.classList.remove('hidden');
}

function resetZoom() {
  const svg = document.getElementById('map-svg');
  animateViewBox(svg, { x: 0, y: 0, w: PROJECTION.width, h: PROJECTION.height });
  document.querySelectorAll('.pin').forEach(pin => {
    pin.classList.remove('emphasized', 'dimmed');
  });
  document.getElementById('side-panel').classList.add('hidden');
}

document.getElementById('map-svg').addEventListener('click', (e) => {
  if (e.target.matches('.prefecture')) zoomToPrefecture(e.target.dataset.prefName);
});
document.getElementById('reset-zoom').addEventListener('click', resetZoom);
document.getElementById('side-panel-list').addEventListener('click', (e) => {
  if (e.target.matches('.side-panel-item')) showDetailCard(e.target.dataset.spotId);
});
</script>
